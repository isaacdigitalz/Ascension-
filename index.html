<!-- ASCENSION WARNING SYSTEM - Solo Leveling style, same as Branch Deletion screenshot. One system for all deletes. -->
<style>
.asc-warn-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.78);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;padding:0;}
@media(min-width:640px){.asc-warn-overlay{align-items:center;padding:16px;}}
.asc-warn-card{width:100%;max-width:460px;background:#0a1428;background:linear-gradient(180deg,#0d1a32,#081126);border:1px solid rgba(255,46,127,0.35);border-radius:22px 22px 0 0;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,0.7);max-height:88vh;overflow-y:auto;}
@media(min-width:640px){.asc-warn-card{border-radius:18px;}}
.asc-warn-title{font-family:monospace;font-size:12px;letter-spacing:0.18em;color:#ff7aa8;font-weight:bold;margin-bottom:16px;}
.asc-warn-body{font-size:13px;color:#cbd5e1;line-height:1.65;}
.asc-warn-caution{margin-top:18px;border:1px solid rgba(255,255,255,0.75);border-radius:14px;padding:14px 16px;font-family:monospace;font-size:12px;line-height:1.6;color:#ff7aa8;}
.asc-warn-cancel{flex:1;padding:14px;border-radius:999px;background:#0f1c32;border:1px solid #1a2a4a;font-family:monospace;font-size:11px;letter-spacing:0.12em;color:#8fb5e0;cursor:pointer;}
.asc-warn-confirm{flex:1;padding:14px;border-radius:999px;background:#ff2e7f;border:1px solid #ff2e7f;font-family:monospace;font-size:11px;font-weight:bold;letter-spacing:0.12em;color:#fff;cursor:pointer;box-shadow:0 0 18px rgba(255,46,127,0.25);}
</style>
<script>
(function(){
  // Solo Leveling System - Warning write-ups per type, each with its own copy
  var COPY = {
    QUEST: {
      title: "[ WARNING ] QUEST DELETION",
      body: function(d){ return 'You are about to erase the quest <b style="color:#fff;">'+escapeHtml(d.title)+'</b>. All XP, attribute points and skill progress tied to this quest will be lost. If this quest was part of your daily grind, your streak and Lifetime Records will feel it. This action cannot be undone.'; },
      caution: "[ CAUTION ] Quest data and linked progress will be erased.",
      meta: function(d){ return d.meta||""; }
    },
    HABIT: {
      title: "[ WARNING ] HABIT TERMINATION",
      body: function(d){ return 'You are about to terminate the habit <b style="color:#fff;">'+escapeHtml(d.title)+'</b>. Your current streak and the full history of completions for this habit will be wiped from your System. The System will no longer track this habit. This action cannot be undone.'; },
      caution: "[ CAUTION ] Habit streak and history will be erased.",
      meta: function(d){ return d.meta||""; }
    },
    VAULT: {
      title: "[ WARNING ] VAULT REMOVAL",
      body: function(d){ return 'You are about to remove <b style="color:#fff;">'+escapeHtml(d.title)+'</b> from your Inventory Vault. Its progress, notes and completion record will be erased from your System. If this was a book or course, your Lifetime Records count will drop. This action cannot be undone.'; },
      caution: "[ CAUTION ] Item data and progress will be erased.",
      meta: function(d){ return d.meta||""; }
    },
    SKILL: {
      title: "[ WARNING ] SKILL DELETION",
      body: function(d){ return 'You are about to remove the skill <b style="color:#fff;">'+escapeHtml(d.title)+'</b> from this branch. Its level, XP and link to your quests will be erased. The skill will vanish from your Skill Tree when you save. This action cannot be undone.'; },
      caution: "[ CAUTION ] Skill level and XP will be erased.",
      meta: function(d){ return d.meta||""; }
    }
  };
  function escapeHtml(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  window.__ascAskDelete = function(details, onConfirm){
    // Remove any existing warning (never stack)
    var ex = document.querySelector(".asc-warn-overlay"); if(ex) ex.remove();
    var cfg = COPY[details.kind] || COPY.QUEST;
    var overlay = document.createElement("div"); overlay.className="asc-warn-overlay";
    var card = document.createElement("div"); card.className="asc-warn-card";
    var metaLine = details.meta ? '<div style="margin-top:8px;font-family:monospace;font-size:11px;color:#5a789e;">'+escapeHtml(details.meta)+'</div>' : '';
    card.innerHTML =
      '<div class="asc-warn-title">'+cfg.title+'</div>'
      + '<div class="asc-warn-body">'+cfg.body(details)+metaLine+'</div>'
      + '<div class="asc-warn-caution">'+cfg.caution+'</div>'
      + '<div style="display:flex;gap:12px;margin-top:20px;"><button class="asc-warn-cancel">CANCEL</button><button class="asc-warn-confirm">CONFIRM DELETE</button></div>';
    overlay.appendChild(card); document.body.appendChild(overlay);
    function close(){ overlay.remove(); }
    card.querySelector(".asc-warn-cancel").onclick = close;
    overlay.addEventListener("click", function(e){ if(e.target===overlay) close(); });
    // ESC to cancel
    function onKey(e){ if(e.key==="Escape"){ close(); document.removeEventListener("keydown", onKey); } }
    document.addEventListener("keydown", onKey);
    card.querySelector(".asc-warn-confirm").onclick = function(){
      close();
      try{ if(typeof onConfirm==="function") onConfirm(); }catch(e){ console.error(e); }
    };
  };
})();
</script>
